# Ambiente de desenvolvimento local. Não use as senhas padrão em produção.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${DOCKER_APP_PORT:-8000}:80"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DOCKER_DB_DATABASE:-hackathon}
      DB_USERNAME: ${DOCKER_DB_USERNAME:-hackathon}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}
      DB_URL: ""
      DB_SOCKET: ""
    volumes:
      # O código local fica disponível imediatamente, sem reconstruir a imagem.
      - ./app:/var/www/html/app
      - ./bootstrap/app.php:/var/www/html/bootstrap/app.php
      - ./bootstrap/providers.php:/var/www/html/bootstrap/providers.php
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./public:/var/www/html/public
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./tests:/var/www/html/tests
      - type: bind
        source: ./.env
        target: /var/www/html/.env
        bind:
          create_host_path: false
      - app-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy

  # Preparado por ./hackaton setup ou ./hackaton ia-setup (também no PowerShell).
  # Sem portas publicadas: acessível apenas pela rede interna do projeto.
  ollama:
    image: ollama/ollama:latest
    profiles: [ia-local]
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    volumes:
      - ollama-data:/root/.ollama

  vite:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    init: true
    command: ["npm", "run", "dev"]
    ports:
      - "127.0.0.1:${DOCKER_VITE_PORT:-5173}:${DOCKER_VITE_PORT:-5173}"
    environment:
      VITE_SERVER_HOST: 0.0.0.0
      VITE_PORT: ${DOCKER_VITE_PORT:-5173}
      VITE_HMR_HOST: localhost
    volumes:
      - ./app:/app/app:ro
      - ./resources:/app/resources:ro
      - ./routes:/app/routes:ro
      - ./public:/app/public
      - ./vite.config.js:/app/vite.config.js:ro

  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${DOCKER_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-hackathon}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-hackathon}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 3m

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    ports:
      - "127.0.0.1:${DOCKER_PHPMYADMIN_PORT:-8080}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  app-storage:
  mysql-data:
  ollama-data:
